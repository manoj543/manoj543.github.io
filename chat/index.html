<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Everyday AI · Your assistant</title><link rel="stylesheet" href="./static/style.css"><script src="./static/config.js"></script><script defer src="./static/chat.js"></script></head>
<body><main>
<header><div class="brand"><span class="logo">✦</span><div><strong>Everyday AI</strong><small>A little clarity, whenever you need it.</small></div></div><button id="clear" type="button">New chat</button></header>
<section id="chat" aria-label="Conversation" aria-live="polite"><div id="welcome"><span class="eyebrow">YOUR SPACE TO ASK</span><h1>What’s on your mind?</h1><p>Explore an idea, understand something new,<br>or get a hand with your next task.</p><div class="suggestions"><button type="button">Explain async and await in Python</button><button type="button">Help me prepare for an interview</button><button type="button">How can I plan a productive day?</button></div></div></section>
<footer><p id="status" role="status"></p><form id="form"><label class="sr-only" for="message">Your message</label><textarea id="message" rows="2" maxlength="8000" placeholder="Ask anything…" required></textarea><button id="send" type="submit">Send ↑</button></form><small>AI can make mistakes. Messages are sent to the configured AI provider. Chat history stays in this tab until you reload.</small></footer>
</main></body></html>
